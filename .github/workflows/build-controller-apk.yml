name: Build Controller APK (Modern Devices)

on:
  push:
    branches: [ "controller" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Controller APK (arm64-v8a only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # إصدار Flutter نفسه الذي يستخدمه مؤلف المشروع (كما في Dockerfile)
      - name: Setup Flutter 3.27.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      # بناء للأجهزة الحديثة فقط (64-bit ARM):
      # ينتج APK واحدًا يحتوي مكتبات arm64-v8a فقط،
      # ولن يُثبَّت على الأجهزة القديمة 32-bit نهائيًا
      - name: Build Release APK (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          VERSION=$(grep -oP '^version:\s*\K[0-9]+' pubspec.yaml | head -1)
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk \
             "output/MikroNet-Controller-v${VERSION}-arm64.apk"
          ls -la output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MikroNet-Controller-arm64-APK
          path: output/*.apk
          if-no-files-found: error
