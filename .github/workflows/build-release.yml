name: Build Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # إعداد ملف Firebase: من الـ Secret إن وُجد، وإلا قيم مؤقتة للبناء فقط
      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 -d > app/google-services.json
            echo "OK: google-services.json from secrets"
          else
            cat > app/google-services.json << 'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "mikronet-placeholder",
              "storage_bucket": "mikronet-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.mikronet.voucher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyA-PLACEHOLDER-000000000000000" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "::warning::Secret GOOGLE_SERVICES_BASE64 غير مضبوط — استُخدمت قيم مؤقتة، تسجيل الدخول عبر Firebase لن يعمل في هذا الـ APK"
          fi

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # التوقيع: يُستخدم مفتاح الإصدار من الـ Secrets إن وُجد، وإلا مفتاح debug
      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0")
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk "output/MikroNet-Voucher-v${VERSION}.apk"
          ls -la output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MikroNet-Voucher-Release-APK
          path: output/*.apk
          if-no-files-found: error

      # عند دفع وسم v* يُنشأ Release ويرفع إليه الـ APK
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
