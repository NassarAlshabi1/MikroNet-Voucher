plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.ztech.mikronet"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ztech.mikronet"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // توقيع الإصدار من متغيرات البيئة في CI:
            // KEYSTORE_FILE + KEYSTORE_PASSWORD + KEY_ALIAS + KEY_PASSWORD
            def ksPath = System.getenv("KEYSTORE_FILE")
            def storePass = System.getenv("KEYSTORE_PASSWORD")
            def alias = System.getenv("KEY_ALIAS")
            def keyPass = System.getenv("KEY_PASSWORD")
            if (ksPath != null && storePass != null && alias != null && keyPass != null && file(ksPath).exists()) {
                storeFile = file(ksPath)
                storePassword = storePass
                keyAlias = alias
                keyPassword = keyPass
            }
        }
    }

    buildTypes {
        release {
            // يوقّع بمفتاح الإصدار إن توفّر، وإلا بمفتاح debug
            signingConfig = signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
